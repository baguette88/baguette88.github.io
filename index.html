<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BAGUETTE.ART — display case</title>
<meta name="description" content="A display case of games by baguette88.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f;
    --bg2:#14141c;
    --ink:#e8e8f0;
    --dim:#6d6d80;
    --accent:#ff4d1a;
    --accent2:#ffd300;
    --grid:rgba(255,255,255,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -200px, rgba(255,77,26,.12), transparent 60%),
      radial-gradient(800px 400px at 90% 110%, rgba(255,211,0,.08), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Space Grotesk", system-ui, sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at 50% 40%, #000 50%, transparent 85%);
    pointer-events:none;
    z-index:0;
  }
  header{
    position:relative;z-index:2;
    padding:40px clamp(20px,5vw,64px) 24px;
    display:flex;align-items:baseline;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .brand{
    font-family:"VT323",monospace;
    font-size:clamp(28px,4vw,44px);
    letter-spacing:.04em;
    color:var(--ink);
    display:flex;align-items:center;gap:14px;
  }
  .brand .dot{
    width:12px;height:12px;border-radius:999px;background:var(--accent);
    box-shadow:0 0 0 4px rgba(255,77,26,.2),0 0 24px var(--accent);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{50%{transform:scale(1.25);opacity:.7}}
  .subhead{
    color:var(--dim);font-size:13px;letter-spacing:.2em;text-transform:uppercase;
  }
  main{
    position:relative;z-index:2;
    padding: 8px clamp(20px,5vw,64px) 80px;
    max-width:1400px;margin:0 auto;
  }
  .section-title{
    font-family:"VT323",monospace;
    font-size:22px;letter-spacing:.15em;color:var(--dim);
    margin: 24px 0 18px;
    display:flex;align-items:center;gap:12px;
  }
  .section-title::after{
    content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--grid),transparent);
  }
  .grid{
    display:grid;gap:24px;
    grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  }
  .grid.hero{
    grid-template-columns:1fr;
  }
  .grid.hero .tile{ aspect-ratio: 21/9; }
  @media (max-width:720px){
    .grid.hero .tile{ aspect-ratio: 16/10; }
  }
  .tile{
    position:relative;
    aspect-ratio: 16/10;
    border-radius:14px;
    overflow:hidden;
    background:var(--bg2);
    border:1px solid rgba(255,255,255,.06);
    text-decoration:none;color:inherit;
    transition:transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    display:block;
    cursor:pointer;
    isolation:isolate;
  }
  .tile:hover, .tile:focus-visible{
    transform:translateY(-4px);
    border-color:var(--accent);
    box-shadow:0 20px 40px -20px rgba(255,77,26,.6), 0 0 0 1px var(--accent) inset;
    outline:none;
  }
  .tile .art{
    position:absolute;inset:0;
    background:
      linear-gradient(180deg, rgba(10,10,15,0) 40%, rgba(10,10,15,.92) 100%),
      linear-gradient(135deg,#1a0f08 0%, #2b1a0b 50%, #0a0a0f 100%);
  }
  .tile video.preview{
    position:absolute;inset:0;
    width:100%;height:100%;object-fit:cover;
    z-index:0;
    pointer-events:none;
    filter:saturate(1.05) contrast(1.02);
  }
  .tile .scrim{
    position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg, rgba(10,10,15,0) 45%, rgba(10,10,15,.92) 100%);
    pointer-events:none;
  }
  .tile .meta{
    position:absolute;left:0;right:0;bottom:0;padding:18px 20px;
    z-index:2;
    display:flex;align-items:flex-end;justify-content:space-between;gap:14px;
  }
  .tile h3{
    font-family:"VT323",monospace;
    font-size:32px;letter-spacing:.06em;line-height:1;
  }
  .grid.hero .tile h3{ font-size:64px; letter-spacing:.08em; }
  .grid.hero .tile .meta{ padding:32px 36px; }
  .grid.hero .tile .tag{ font-size:13px; margin-top:10px; }
  @media (max-width:720px){
    .grid.hero .tile h3{ font-size:40px; }
    .grid.hero .tile .meta{ padding:20px 22px; }
  }
  .tile .tag{
    font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);
    margin-top:6px;
  }
  .badge{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;
    padding:4px 8px;border-radius:999px;
    background:rgba(255,77,26,.15);color:var(--accent);
    border:1px solid rgba(255,77,26,.35);
  }
  /* coming soon tiles */
  .tile.soon{
    cursor:not-allowed;
    opacity:.5;
  }
  .tile.soon:hover{transform:none;border-color:rgba(255,255,255,.06);box-shadow:none}
  .tile.soon .art{
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 10px, transparent 10px 20px),
      var(--bg2);
  }
  .tile.soon h3{color:var(--dim)}

  footer{
    position:relative;z-index:2;
    padding:24px clamp(20px,5vw,64px) 48px;
    color:var(--dim);font-size:12px;letter-spacing:.15em;text-transform:uppercase;
    display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;
  }
  footer a{color:var(--dim);text-decoration:none;border-bottom:1px dotted var(--dim)}
  footer a:hover{color:var(--ink)}
  ::selection{background:var(--accent);color:#000}
</style>
</head>
<body>
  <header>
    <div class="brand"><span class="dot"></span>BAGUETTE.ART</div>
    <div class="subhead">/ display case</div>
  </header>

  <main>
    <div class="section-title">NOW PLAYING</div>
    <div class="grid hero">
      <a class="tile" href="https://baguette8.itch.io/mbud" target="_blank" rel="noopener" aria-label="Play Machine Bros">
        <video class="preview" src="./media/mb-preview.mp4" autoplay muted loop playsinline preload="auto"></video>
        <div class="scrim"></div>
        <div class="meta">
          <div>
            <h3>MACHINE BROS</h3>
            <div class="tag">3D kart runner · three.js</div>
          </div>
          <span class="badge">Play</span>
        </div>
      </a>
    </div>

    <div class="section-title">COMING SOON</div>
    <div class="grid">
      <div class="tile soon" aria-hidden="true">
        <div class="art"></div>
        <div class="meta"><div><h3>???</h3><div class="tag">in development</div></div></div>
      </div>
      <div class="tile soon" aria-hidden="true">
        <div class="art"></div>
        <div class="meta"><div><h3>???</h3><div class="tag">in development</div></div></div>
      </div>
    </div>
  </main>

  <footer>
    <div>© baguette88</div>
    <div><a href="https://github.com/baguette88" target="_blank" rel="noopener">github.com/baguette88</a></div>
  </footer>

<script>
  // keyboard: enter on focused tile goes to it (default link behavior does this)
  // arrows navigate tiles like a launcher
  const tiles = [...document.querySelectorAll('.tile:not(.soon)')];
  let idx = 0;
  if(tiles.length){ tiles[0].focus({preventScroll:true}); }
  document.addEventListener('keydown', e => {
    if(!tiles.length) return;
    if(['ArrowRight','ArrowDown'].includes(e.key)){ idx = (idx+1) % tiles.length; tiles[idx].focus(); e.preventDefault(); }
    if(['ArrowLeft','ArrowUp'].includes(e.key)){ idx = (idx-1+tiles.length) % tiles.length; tiles[idx].focus(); e.preventDefault(); }
  });
</script>
</body>
</html>
