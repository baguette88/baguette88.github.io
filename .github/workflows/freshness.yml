name: Content Freshness
on:
  schedule:
    # Run every Sunday at 4am UTC — updates a batch of article lastmod dates
    - cron: '0 4 * * 0'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update sitemap lastmod dates
        run: |
          TODAY=$(date +%Y-%m-%d)

          # Pick 8 random articles to refresh this week
          ARTICLES=$(grep -oP 'articles/[^<]+\.html' sitemap.xml | shuf | head -8)

          for article in $ARTICLES; do
            # Update lastmod in sitemap for this article
            sed -i "/$article/{n;s|<lastmod>[^<]*</lastmod>|<lastmod>$TODAY</lastmod>|}" sitemap.xml
          done

          echo "Updated lastmod for:"
          echo "$ARTICLES"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh sitemap lastmod dates"
            git push
          fi
